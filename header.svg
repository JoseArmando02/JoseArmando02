<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="José Armando Pichal Pio - Bases de Datos y Análisis de Datos" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="sub" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Ventana -->
  <rect x="20" y="20" width="860" height="240" rx="12" fill="#0d1117" stroke="#30363d"/>
  <line x1="20" y1="60" x2="880" y2="60" stroke="#30363d"/>
  <circle cx="44" cy="40" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="40" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="40" r="6" fill="#27c93f"/>
  <text x="450" y="44" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b949e">~/JoseArmando02 — zsh</text>

  <!-- Texto -->
  <text x="60" y="102" font-family="monospace" font-size="16" fill="#8b949e" opacity="0">
    <tspan fill="#34d399">&gt;</tspan> python <tspan fill="#22d3ee">whoami.py</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="60" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#e6edf3" opacity="0">
    José Armando Pichal Pio
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.6s" fill="freeze"/>
  </text>
  <text x="60" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#sub)" opacity="0">
    Bases de Datos · Análisis de Datos
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.1s" fill="freeze"/>
  </text>
  <text x="60" y="218" font-family="monospace" font-size="14" fill="#8b949e" opacity="0">
    postgresql · mysql · mongodb · ETL · power bi
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.6s" fill="freeze"/>
  </text>
  <text x="448" y="218" font-family="monospace" font-size="14" fill="#a78bfa">_
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- Ilustración: pila de base de datos -->
  <g>
    <rect x="665" y="175" width="110" height="32" fill="#34d399"/>
    <ellipse cx="720" cy="207" rx="55" ry="13" fill="#34d399"/>
    <ellipse cx="720" cy="175" rx="55" ry="13" fill="#6ee7b7"/>

    <rect x="665" y="135" width="110" height="32" fill="#22d3ee"/>
    <ellipse cx="720" cy="167" rx="55" ry="13" fill="#22d3ee"/>
    <ellipse cx="720" cy="135" rx="55" ry="13" fill="#67e8f9"/>

    <rect x="665" y="95" width="110" height="32" fill="#a78bfa"/>
    <ellipse cx="720" cy="127" rx="55" ry="13" fill="#a78bfa"/>
    <ellipse cx="720" cy="95" rx="55" ry="13" fill="#c4b5fd"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Mini gráfica de barras -->
  <g fill="#f472b6">
    <rect x="805" y="150" width="12" height="60" rx="2">
      <animate attributeName="y" values="170;150;170" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="40;60;40" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="823" y="130" width="12" height="80" rx="2" fill="#fbbf24">
      <animate attributeName="y" values="130;160;130" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;50;80" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="841" y="160" width="12" height="50" rx="2" fill="#22d3ee">
      <animate attributeName="y" values="160;140;160" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="50;70;50" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Barra degradada -->
  <rect x="20" y="262" width="860" height="6" rx="3" fill="url(#bar)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
